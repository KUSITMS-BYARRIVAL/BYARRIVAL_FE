# Expo Go (빌드 금지) — 앱 ID가 iOS·Android 대소문자가 다르다
appId: "${maestro.platform == 'android' ? 'host.exp.exponent' : 'host.exp.Exponent'}"
onFlowStart:
  - runFlow: ../subflows/go-home.yml
---
- tapOn: "마이"
# 7개 API를 다 받을 때까지 로딩 점이 보인다
- extendedWaitUntil:
    visible: "나의 기록"
    timeout: 15000
- assertVisible: ".*이야기로 채워졌어요.*"

# 프로필 아이콘 → 프로필 이동은 확인하지 않는다 (Expo Go 톱니 버튼이 아이콘과 겹쳐 탭을 가로챔)

- scrollUntilVisible:
    element: "나의 기록 요약"
- scrollUntilVisible:
    element: "평일\\(월~금\\) 기준"

# 최근 저장한 기사 '전체보기' → 보관함 기사 탭
- scrollUntilVisible:
    element: "전체보기"
    # 탭 바 뒤에 가려진 채로 '보인다'고 판단해 탭이 탭 바에 눌리므로 가운데로 끌어온다
    centerElement: true
- tapOn: "전체보기"
- assertVisible:
    # 탭 라벨 뒤에 개수가 붙는다 ('기사, · 4')
    text: "기사.*"
    selected: true
